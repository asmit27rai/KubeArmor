name: ci-release-operator-ubi-fork-test

on:
  push:
    branches:
      - binary-artifacts-release-test
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag or branch to test. Leave empty to use the selected branch."
        type: "string"
        required: false

permissions: read-all

env:
  PLATFORM: linux/amd64

jobs:
  kubearmor-operator-ubi-release-test:
    name: Build KubeArmor Operator UBI Release Locally
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "KubeArmor/go.mod"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2
        with:
          platforms: linux/amd64

      - name: Get Tag
        id: vars
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            let tag = context.payload.inputs?.tag;
            if (tag && tag.trim().length > 0) {
              await exec.exec('git', ['fetch', '--tags']);
              core.info(`Checking out ref: ${tag}`);
              await exec.exec('git', ['checkout', tag]);
            } else {
              const ref = context.ref;
              tag = ref === "refs/heads/main" ? "latest" : ref.replace(/^refs\/[^/]+\//, "");
            }
            core.setOutput('tag', tag);
            console.log(`Testing operator UBI release build with tag: ${tag}`);

      - name: Install LLVM/Clang
        run: ./.github/workflows/install-llvm.sh

      - name: Install libbpf headers
        run: sudo apt-get update && sudo apt-get install -y libbpf-dev

      - name: Install bpftool
        run: ./.github/workflows/install-bpftool.sh

      - name: Generate vmlinux.h
        run: make -C BPF kernel_headers
        working-directory: KubeArmor

      - name: Generate BPF files
        run: go generate ./...
        working-directory: KubeArmor

      - name: Verify generated BPF object files
        run: |
          set -euo pipefail
          files=(
            KubeArmor/BPF/vmlinux.h
            KubeArmor/enforcer/bpflsm/enforcer_bpfel.o
            KubeArmor/enforcer/bpflsm/enforcer_bpfeb.o
            KubeArmor/monitor/monitor_bpfel.o
            KubeArmor/monitor/monitor_bpfeb.o
            KubeArmor/presets/anonmapexec/anonmapexec_bpfel.o
            KubeArmor/presets/anonmapexec/anonmapexec_bpfeb.o
            KubeArmor/presets/exec/exec_bpfel.o
            KubeArmor/presets/exec/exec_bpfeb.o
            KubeArmor/presets/filelessexec/filelessexec_bpfel.o
            KubeArmor/presets/filelessexec/filelessexec_bpfeb.o
            KubeArmor/presets/protectenv/protectenv_bpfel.o
            KubeArmor/presets/protectenv/protectenv_bpfeb.o
            KubeArmor/presets/protectproc/protectproc_bpfel.o
            KubeArmor/presets/protectproc/protectproc_bpfeb.o
            KubeArmor/utils/bpflsmprobe/probe_bpfel.o
            KubeArmor/utils/bpflsmprobe/probe_bpfeb.o
          )
          for f in "${files[@]}"; do
            ls -lh "$f"
            test -s "$f"
          done

      - name: Verify Docker context includes generated probe objects
        run: |
          tar --exclude-vcs -cf /tmp/operator-context.tar .
          tar -tf /tmp/operator-context.tar | grep 'KubeArmor/utils/bpflsmprobe/probe_bpfel.o'
          tar -tf /tmp/operator-context.tar | grep 'KubeArmor/utils/bpflsmprobe/probe_bpfeb.o'

      - name: Build KubeArmor Operator UBI Images
        working-directory: ./pkg/KubeArmorOperator
        run: PLATFORM=$PLATFORM make docker-buildx-ubi TAG=${{ steps.vars.outputs.tag }} BUILD_MODE=--load
